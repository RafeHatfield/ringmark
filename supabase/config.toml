# Supabase local dev config — optional, only needed if you run `supabase start`
# Run `supabase link --project-ref <your-project-ref>` to connect to your cloud project

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# OAuth 2.1 authorization server — what MCP clients (claude.ai and friends)
# authenticate against. The resource server side lives in the app:
#   /.well-known/oauth-protected-resource   RFC 9728 metadata
#   /oauth/consent                          the screen named below
#   /api/mcp                                the protected resource itself
#
# allow_dynamic_registration is required by claude.ai's custom connector flow —
# it registers itself rather than using pre-issued credentials. It also means
# any client can self-register, so the consent screen is the only human gate;
# see the comment at the top of app/oauth/consent/page.tsx.
#
# NOTE: this configures `supabase start` locally only. The hosted project needs
# the same switches under Authentication → OAuth Server in the dashboard, and
# they are currently OFF (the AS metadata endpoint returns feature_disabled).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true
